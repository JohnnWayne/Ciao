    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    background-repeat:no-repeat;
    position:relative;
  }

  .board{
    width:100%;
    max-width:760px;
    background:
      radial-gradient(rgba(0,0,0,.045) 1px, transparent 1.4px) 0 0/6px 6px,
      rgba(255,255,255,.96);
    backdrop-filter: blur(6px);
    border:1px solid rgba(0,0,0,.08);
    border-radius:10px;
    box-shadow:0 30px 70px -25px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.4);
    padding:clamp(20px,4vw,36px);
    padding-top:clamp(56px,9vw,84px);
    margin-top:clamp(50px,10vw,90px);
    position:relative;
    z-index:1;
    overflow:visible;
  }

  .fullscreen-btn{
    position:absolute;
    top:14px;
    right:14px;
    width:30px;
    height:30px;
    background:transparent;
    border:none;
    padding:0;
    cursor:pointer;
    color:var(--muted);
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    transition:color .15s, background .15s;
    z-index:2;
  }
  .fullscreen-btn:hover, .fullscreen-btn:focus-visible{
    color:#ff4385;
    background:rgba(0,0,0,.05);
  }
  .fullscreen-btn svg{ width:16px; height:16px; }
  .fullscreen-btn .icon-exit{ display:none; }
  body.is-fullscreen .fullscreen-btn .icon-enter{ display:none; }
  body.is-fullscreen .fullscreen-btn .icon-exit{ display:block; }

  .logo-wrap{
    position:absolute;
    top:0;
    left:50%;
    transform:translate(-50%,-58%);
    z-index:3;
    pointer-events:none;
    width:100%;
    display:flex;
    justify-content:center;
  }

  .logo{
    width:100%;
    max-width:clamp(240px,58vw,440px);
    height:auto;
    display:block;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(255,77,94,.35));
  }

  .headers{
    display:flex;
    justify-content:center;
    gap:clamp(28px,7vw,64px);
    margin-bottom:6px;
  }
  .headers span{
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--muted);
    width:clamp(90px,20vw,150px);
    text-align:center;
    display:inline-block;
  }

  .rule{
    border:none;
    border-top:1px solid var(--line);
    margin:0 0 18px;
  }

  .countdown{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:clamp(10px,3vw,22px);
  }

  .unit{
    font-family:'VT323', monospace;
    font-weight:400;
    font-size:clamp(64px,17vw,120px);
    letter-spacing:.03em;
    width:clamp(90px,20vw,150px);
    line-height:1;
    text-align:center;
    color:#ff4385;
  }

  .colon{
    font-family:'VT323', monospace;
    font-weight:400;
    font-size:clamp(48px,12vw,84px);
    color:#ff4385;
    opacity:.6;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink{ 0%,100%{ opacity:.6; } 50%{ opacity:.15; } }

  .finished{
    display:none;
    text-align:center;
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(28px,7vw,46px);
    color:#ff4385;
    letter-spacing:.02em;
    line-height:1.25;
  }

  .board.done .countdown,
  .board.done .headers,
  .board.done .rule{ display:none; }
  .board.done .finished{ display:block; padding:26px 0; }

  /* Confettis */
  #confetti-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:5;
  }

  .confetti-piece{
    position:absolute;
    top:-20px;
    width:10px;
    height:16px;
    opacity:.95;
    will-change: transform;
    animation-name: confetti-fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }

  @keyframes confetti-fall{
    0%{
      transform: translateY(0) translateX(0) rotate(0deg);
      opacity:1;
    }
    100%{
      transform: translateY(115vh) translateX(var(--drift)) rotate(var(--spin));
      opacity:.9;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .colon{ animation:none; }
    .confetti-piece{ animation:none; display:none; }
  }
</style>
</head>

    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen();
    }
  });
  document.addEventListener('fullscreenchange', function(){
    document.body.classList.toggle('is-fullscreen', !!document.fullscreenElement);
  });

  // Confettis rose & noir en continu
  var confettiLayer = document.getElementById('confetti-layer');
  var colors = ['#FF4D5E', '#FF9FB3', '#0a0a0b', '#FFC53D'];

  function spawnConfetti(){
    var piece = document.createElement('div');
    piece.className = 'confetti-piece';

    var startX = Math.random() * 100;
    var drift = (Math.random() * 160 - 80) + 'px';
    var spin = (Math.random() * 720 - 360) + 'deg';
    var duration = 4 + Math.random() * 3.5;
    var size = 6 + Math.random() * 8;
    var color = colors[Math.floor(Math.random() * colors.length)];
    var isCircle = Math.random() > 0.6;

    piece.style.left = startX + 'vw';
    piece.style.width = size + 'px';
    piece.style.height = (size * 1.5) + 'px';
    piece.style.background = color;
    piece.style.borderRadius = isCircle ? '50%' : '2px';
    piece.style.setProperty('--drift', drift);
    piece.style.setProperty('--spin', spin);
    piece.style.animationDuration = duration + 's';

    confettiLayer.appendChild(piece);

    setTimeout(function(){
      piece.remove();
    }, duration * 1000 + 200);
  }

  function startConfetti(){
    for(var i=0; i<25; i++){
      setTimeout(spawnConfetti, i * 60);
    }
    setInterval(function(){
      for(var i=0; i<4; i++){
        spawnConfetti();
      }
    }, 250);
  }
})();
</script>

</body>
</html>
